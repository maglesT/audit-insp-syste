name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  sources-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 -m pip install -q -r requirements.txt
      - run: python3 tools/inventory.py check
      - run: python3 tools/library/layer1.py
      - run: python3 -m unittest discover -s tests
